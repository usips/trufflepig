[package]
name = "tp-semantic"
version.workspace = true
edition.workspace = true
publish = false

[features]
semantic = ["dep:fastembed", "dep:ort"]
semantic-cuda = ["semantic", "ort/cuda"]
# Test-only hooks for other workspace crates' tests.
test-support = []

[dependencies]
anyhow.workspace = true
blake3.workspace = true
fs2.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tp-core.workspace = true
fastembed = { workspace = true, optional = true }
ort = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tp-core = { workspace = true, features = ["test-support"] }

[[example]]
name = "semantic_benchmark"
required-features = ["semantic"]
