[package]
name = "trufflepig"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
ignore = "0.4"
imara-diff = "=0.2.0"
libc = "0.2"
notify = "8"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
streaming-iterator = "=0.1.9"
tempfile = "3"
toml = "0.9"
tiktoken-rs = "0.9"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-luau = "=1.2.0"
uuid = { version = "1", features = ["v4"] }
fastembed = { version = "=6.1.0", default-features = false, features = ["ort-load-dynamic"], optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"], optional = true }

[features]
semantic = ["dep:fastembed", "dep:ort"]
semantic-cuda = ["semantic", "ort/cuda"]
