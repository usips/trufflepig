[package]
name = "trufflepig"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace]
members = ["crates/tp-core", "crates/tp-extract", "crates/tp-history", "crates/tp-index", "crates/tp-semantic"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
ignore = "0.4"
imara-diff = "=0.2.0"
quick-xml = "=0.38.3"
libc = "0.2"
notify = "8"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
regex = "1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
streaming-iterator = "=0.1.9"
tempfile = "3"
toml = "0.9"
tiktoken-rs = "0.9"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-luau = "=1.2.0"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-php = "=0.24.2"
uuid = { version = "1", features = ["v4"] }
fastembed = { version = "=6.1.0", default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
tp-core = { path = "crates/tp-core" }
tp-extract = { path = "crates/tp-extract" }
tp-history = { path = "crates/tp-history" }
tp-index = { path = "crates/tp-index" }
tp-semantic = { path = "crates/tp-semantic" }

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
fs2.workspace = true
ignore.workspace = true
imara-diff.workspace = true
quick-xml.workspace = true
libc.workspace = true
notify.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
streaming-iterator.workspace = true
tempfile.workspace = true
toml.workspace = true
tiktoken-rs.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-luau.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-php.workspace = true
uuid.workspace = true
tp-core.workspace = true
tp-extract.workspace = true
tp-history.workspace = true
tp-index.workspace = true
tp-semantic.workspace = true

[dev-dependencies]
tp-core = { workspace = true, features = ["test-support"] }
tp-index = { workspace = true, features = ["test-support"] }
tp-semantic = { workspace = true, features = ["test-support"] }

[features]
semantic = ["tp-index/semantic", "tp-semantic/semantic"]
semantic-cuda = ["semantic", "tp-semantic/semantic-cuda"]

# Dependencies (bundled SQLite, tree-sitter grammars, blake3, tiktoken) run
# optimized in debug builds; workspace crates keep fast incremental builds.
[profile.dev.package."*"]
opt-level = 3

# Unwinding stays enabled: the daemon pool isolates jobs with catch_unwind.
[profile.release]
lto = "thin"

# Release code plus line tables for profilers: `cargo build --profile profiling`
# writes target/profiling/.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
