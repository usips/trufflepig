# Append to $KIMI_CODE_HOME/config.toml (default ~/.kimi-code/config.toml).
# `install.sh --kimi-hooks` does this for you between marker comments.
# The session hooks only start the per-user router, best effort; they record no
# identity. Kimi's session id comes from KIMI_SESSION_ID when it is exported.
# The PreToolUse hook steers Grep/Glob and shell rg/grep/find searches toward
# trufflepig-agent inside indexed checkouts (pipe filters and log reads are
# ignored): it blocks (exit 2) until
# trufflepig-agent has been used from the directory, then allows. Set
# TRUFFLEPIG_AGENT_STEER=strict|nudge|off (or `install.sh --kimi --steer MODE`).

[[hooks]]
event = "PreToolUse"
matcher = "^(Grep|Glob|Bash)$"
command = "trufflepig-agent-steer kimi"
timeout = 5

[[hooks]]
event = "SessionStart"
command = "trufflepig-agent-session kimi start"
timeout = 5

[[hooks]]
event = "SessionEnd"
command = "trufflepig-agent-session kimi end"
timeout = 5
